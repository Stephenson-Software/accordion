# Server Configuration
server.port=3000

# Application Name
spring.application.name=accordion-webapp

# Backend Configuration (Client-side)
# These URLs are used by browser JavaScript to connect to the backend; the webapp server
# itself never calls the backend, so there is no server-side URL to configure.
# Must be accessible from the user's browser (use localhost or public domain)
# Note: For SockJS, use HTTP(S) URL - SockJS will handle WebSocket upgrade internally
accordion.backend.client.url=http://localhost:8080
accordion.backend.client.ws.url=http://localhost:8080/ws

# Thymeleaf Configuration
spring.thymeleaf.cache=false
